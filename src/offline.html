<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https: http:">
  <title>InfoTech — No connection</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f8fb; --card: #ffffff; --text: #0f172a; --muted: #64748b; --accent: #1d4ed8; --line: #e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #111a2e; --text: #e2e8f0; --muted: #94a3b8; --accent: #60a5fa; --line: #1e293b; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-app-region: drag; }
    main { width: min(420px, calc(100% - 32px)); padding: 36px 32px; text-align: center; background: var(--card);
      border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(15, 23, 42, .06); -webkit-app-region: no-drag; }
    svg { width: 44px; height: 44px; color: var(--muted); }
    h1 { margin: 14px 0 6px; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 22px; color: var(--muted); }
    p[dir="rtl"] { margin-top: -14px; }
    button { appearance: none; border: 0; border-radius: 10px; padding: 10px 22px; font: inherit; font-weight: 600;
      color: #fff; background: var(--accent); cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    small { display: block; margin-top: 16px; color: var(--muted); min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 8.8a15 15 0 0 1 4.2-2.6M9.9 5.1A15 15 0 0 1 22 8.8M5 12.5a10 10 0 0 1 3.6-2.1M15.4 10.5A10 10 0 0 1 19 12.5M8.5 16a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/>
    </svg>
    <h1>No internet connection</h1>
    <p>InfoTech can't reach infotechq8.com. It reconnects by itself as soon as the internet is back.</p>
    <p dir="rtl" lang="ar">لا يوجد اتصال بالإنترنت. سيعود التطبيق تلقائياً عند عودة الاتصال.</p>
    <button id="retry" type="button">Try again</button>
    <small id="status" role="status"></small>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const raw = params.get('retry') || 'https://infotechq8.com/dashboard';
    const target = /^https?:\/\//.test(raw) ? raw : 'https://infotechq8.com/dashboard';
    const button = document.getElementById('retry');
    const status = document.getElementById('status');
    let checking = false;

    // Only leave this page once the server answers, so "Try again" never lands on a blank window.
    async function tryAgain(manual) {
      if (checking) return;
      checking = true;
      button.disabled = true;
      if (manual) status.textContent = 'Checking…';
      try {
        await fetch(target, { mode: 'no-cors', cache: 'no-store' });
        location.replace(target);
        return;
      } catch {
        if (manual) status.textContent = 'Still offline. Check the Wi-Fi or network cable.';
      }
      checking = false;
      button.disabled = false;
    }

    button.addEventListener('click', () => tryAgain(true));
    window.addEventListener('online', () => tryAgain(false));
    setInterval(() => tryAgain(false), 10000);
  </script>
</body>
</html>
