name: Build & Release

# Tag a version (git tag v0.1.0 && git push --tags) and this builds the Mac and
# Windows installers and attaches them to a GitHub Release, where installed
# apps find them (latest-mac.yml / latest.yml) and update themselves.
# Adapted from UC-Ultra-Desktop's workflow, which went through the signing bugs first.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Each job uploads straight to the Release rather than through Actions artifact
# storage, which fills up fast with 100 MB+ installers.
permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The tag decides the version, not package.json (see the script).
      - name: Take the version from the tag
        run: node .github/scripts/version-from-tag.mjs

      # Until the Apple Developer account exists the Mac build is unsigned:
      # it works, but the first open needs right-click → Open.
      - name: Check for signing secrets
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -n "$CSC_LINK" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; echo "No Apple certificate: building unsigned."; fi

      - name: Write App Store Connect API key to file
        if: steps.signing.outputs.signed == 'true'
        run: echo "${{ secrets.APPLE_API_KEY }}" > apple_api_key.p8

      # The keychain is prepared here rather than by electron-builder: its 24.x
      # code passes the certificate's password where the keychain's belongs and
      # fails at random on newer runner images (found in UC-Ultra).
      - name: Prepare the signing keychain
        if: steps.signing.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 21600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build (arm64 + x64)
        run: |
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --mac --arm64 --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK / CSC_KEY_PASSWORD are deliberately not set here (see above).
          APPLE_API_KEY: ${{ steps.signing.outputs.signed == 'true' && format('{0}/apple_api_key.p8', github.workspace) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Clean up signing files
        if: always()
        run: |
          rm -f apple_api_key.p8
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Publish macOS installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --clobber

  build-win:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Take the version from the tag
        run: node .github/scripts/version-from-tag.mjs

      - name: Build (Windows)
        shell: bash
        # An absent secret arrives as an empty string, and electron-builder
        # treats an empty WIN_CSC_LINK as a path, so only export it when set.
        run: |
          if [ -n "$CERT_B64" ]; then
            export WIN_CSC_LINK="$CERT_B64"
            export WIN_CSC_KEY_PASSWORD="$CERT_PASSWORD"
          else
            echo "No Windows certificate: building unsigned (SmartScreen will warn once)."
          fi
          npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERT_B64: ${{ secrets.WIN_CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Publish Windows installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" release/*.exe release/*.blockmap release/latest.yml --clobber
